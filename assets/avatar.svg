<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="32" fill="url(#bg-grad)" />

  <!-- Outer Orbit Rings -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.4" />
  <circle cx="200" cy="200" r="125" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.6" />

  <!-- Node Dots along Orbit -->
  <circle cx="325" cy="200" r="6" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="200" cy="75" r="5" fill="#a78bfa" filter="url(#glow)" />
  <circle cx="100" cy="270" r="4.5" fill="#38bdf8" />
  <circle cx="280" cy="290" r="5" fill="#c084fc" />

  <!-- Central Tech Shield / Brain Matrix -->
  <circle cx="200" cy="200" r="85" fill="#090d16" stroke="url(#glow-grad)" stroke-width="3" filter="url(#glow)" />
  
  <!-- Neural / Circuit Lines -->
  <path d="M 160 200 L 180 180 L 220 180 L 240 200 L 220 220 L 180 220 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <path d="M 180 180 L 180 155 M 220 180 L 220 155 M 180 220 L 180 245 M 220 220 L 220 245 M 160 200 L 135 200 M 240 200 L 265 200" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
  
  <!-- Circuit Nodes -->
  <circle cx="180" cy="155" r="4" fill="#38bdf8" />
  <circle cx="220" cy="155" r="4" fill="#38bdf8" />
  <circle cx="180" cy="245" r="4" fill="#a78bfa" />
  <circle cx="220" cy="245" r="4" fill="#a78bfa" />
  <circle cx="135" cy="200" r="4" fill="#38bdf8" />
  <circle cx="265" cy="200" r="4" fill="#c084fc" />

  <!-- Center Monogram -->
  <text x="200" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">AI</text>

  <!-- Floating Badge -->
  <rect x="110" y="325" width="180" height="38" rx="19" fill="#0b1120" stroke="#38bdf8" stroke-width="1.5" />
  <text x="200" y="349" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle" letter-spacing="0.5">DAMARLA MANVITHA SRI</text>
</svg>
