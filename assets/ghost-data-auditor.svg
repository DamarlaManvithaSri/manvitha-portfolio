<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="auditor-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="alert-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="600" height="360" rx="16" fill="url(#auditor-bg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Top App Bar -->
  <rect width="600" height="42" rx="16" fill="#0f172a" />
  <circle cx="28" cy="21" r="5" fill="#ef4444" />
  <circle cx="44" cy="21" r="5" fill="#f59e0b" />
  <circle cx="60" cy="21" r="5" fill="#10b981" />
  <text x="300" y="26" font-family="'Courier New', monospace" font-size="12" fill="#94a3b8" text-anchor="middle">ghost-data-auditor // streamlit-dashboard:8501</text>

  <!-- Dashboard Header -->
  <rect x="25" y="60" width="550" height="48" rx="8" fill="#1e293b" opacity="0.6"/>
  <text x="45" y="88" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Ghost Data Auditor</text>
  <rect x="200" y="74" width="125" height="22" rx="11" fill="#065f46" />
  <text x="262" y="89" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#34d399" text-anchor="middle">● AUDIT ACTIVE</text>
  <text x="555" y="89" font-family="'Courier New', monospace" font-size="11" fill="#38bdf8" text-anchor="end">v1.0.0-SEC</text>

  <!-- Metric Card 1: Residual Records Found -->
  <rect x="25" y="125" width="168" height="95" rx="10" fill="#111c33" stroke="#1e293b" stroke-width="1.5"/>
  <text x="40" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Residual Records</text>
  <text x="40" y="185" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#f43f5e">142</text>
  <text x="40" y="205" font-family="system-ui, sans-serif" font-size="10" fill="#fb7185">⚠ Flagged for deletion</text>

  <!-- Metric Card 2: Retention Risk Score -->
  <rect x="216" y="125" width="168" height="95" rx="10" fill="#111c33" stroke="#1e293b" stroke-width="1.5"/>
  <text x="231" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Retention Risk Score</text>
  <text x="231" y="185" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#fbbf24">Medium</text>
  <text x="231" y="205" font-family="system-ui, sans-serif" font-size="10" fill="#fde047">Backup sync sync latency</text>

  <!-- Metric Card 3: Verification Checks -->
  <rect x="407" y="125" width="168" height="95" rx="10" fill="#111c33" stroke="#1e293b" stroke-width="1.5"/>
  <text x="422" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Evidence Checks</text>
  <text x="422" y="185" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#38bdf8">100%</text>
  <text x="422" y="205" font-family="system-ui, sans-serif" font-size="10" fill="#7dd3fc">✔ Remediation ready</text>

  <!-- Lower Panel: Audit Findings Table preview -->
  <rect x="25" y="235" width="550" height="100" rx="10" fill="#0c1322" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Table Header -->
  <rect x="25" y="235" width="550" height="28" rx="8" fill="#1e293b" opacity="0.4"/>
  <text x="45" y="253" font-family="'Courier New', monospace" font-size="11" fill="#64748b">SYSTEM_ID</text>
  <text x="180" y="253" font-family="'Courier New', monospace" font-size="11" fill="#64748b">DATA_TYPE</text>
  <text x="320" y="253" font-family="'Courier New', monospace" font-size="11" fill="#64748b">STATUS</text>
  <text x="460" y="253" font-family="'Courier New', monospace" font-size="11" fill="#64748b">REMEDIATION</text>

  <!-- Table Row 1 -->
  <text x="45" y="280" font-family="'Courier New', monospace" font-size="11" fill="#cbd5e1">s3-backup-node-03</text>
  <text x="180" y="280" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">PII / Email Hash</text>
  <text x="320" y="280" font-family="system-ui, sans-serif" font-size="11" fill="#fb7185">Residual Found</text>
  <text x="460" y="280" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">Purge Cache</text>

  <!-- Table Row 2 -->
  <text x="45" y="312" font-family="'Courier New', monospace" font-size="11" fill="#cbd5e1">analytics-db-replica</text>
  <text x="180" y="312" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">User Analytics Log</text>
  <text x="320" y="312" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">Compliant</text>
  <text x="460" y="312" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">None Needed</text>
</svg>
